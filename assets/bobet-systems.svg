<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Bobet Garlit — Business instinct. Engineering depth.</title>
  <desc id="desc">A warm editorial banner with a diagram connecting a business question to trusted evidence and a working system.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ded9ce"/>
    </pattern>
  </defs>
  <rect width="1280" height="460" rx="24" fill="#f5f2eb"/>
  <rect x="720" width="560" height="460" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="52" width="36" height="5" rx="2.5" fill="#cd451f"/>
    <text x="111" y="60" font-size="17" font-weight="700" letter-spacing="3" fill="#26302f">BOBET GARLIT</text>
    <text x="56" y="163" font-size="65" font-weight="700" letter-spacing="-2.5" fill="#142322">Business instinct.</text>
    <text x="56" y="240" font-size="65" font-weight="700" letter-spacing="-2.5" fill="#142322">Engineering depth.</text>
    <text x="60" y="297" font-size="23" fill="#52605b">From a business question to a working system.</text>
    <line x1="60" y1="354" x2="695" y2="354" stroke="#d6d2c8"/>
    <text x="60" y="397" font-size="16" font-weight="700" letter-spacing="2" fill="#26302f">DATA / ANALYTICS / AI</text>
    <text x="696" y="397" text-anchor="end" font-size="16" fill="#52605b">Ortigas Workflow Lab</text>
    <rect x="800" y="32" width="448" height="396" rx="20" fill="#142322"/>
    <text x="838" y="83" font-size="13" font-weight="700" letter-spacing="2.3" fill="#b9c7c0">MAKE THE CONNECTION</text>
    <path d="M 855 159 V 314" fill="none" stroke="#78938a" stroke-width="2"/>
    <rect x="828" y="111" width="392" height="72" rx="10" fill="#233733" stroke="#3c554d"/>
    <circle cx="854" cy="147" r="5" fill="#f7a87d"/>
    <text x="876" y="142" font-size="12" letter-spacing="1.5" fill="#b9c7c0">01 / CONTEXT</text>
    <text x="876" y="165" font-size="21" font-weight="700" fill="#f5f2eb">The business question</text>
    <rect x="828" y="207" width="392" height="72" rx="10" fill="#233733" stroke="#3c554d"/>
    <circle cx="854" cy="243" r="5" fill="#f7a87d"/>
    <text x="876" y="238" font-size="12" letter-spacing="1.5" fill="#b9c7c0">02 / EVIDENCE</text>
    <text x="876" y="261" font-size="21" font-weight="700" fill="#f5f2eb">Data you can examine</text>
    <rect x="828" y="303" width="392" height="72" rx="10" fill="#f7a87d"/>
    <circle cx="854" cy="339" r="5" fill="#142322"/>
    <text x="876" y="334" font-size="12" letter-spacing="1.5" fill="#3e3026">03 / ACTION</text>
    <text x="876" y="357" font-size="21" font-weight="700" fill="#142322">A system people can use</text>
    <text x="1024" y="404" text-anchor="middle" font-size="12" letter-spacing="1.4" fill="#b9c7c0">BUSINESS CONTEXT. HANDS-ON DELIVERY.</text>
  </g>
</svg>
